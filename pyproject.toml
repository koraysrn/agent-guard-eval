[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-guard-eval"
version = "1.0.0"
description = "LLM tarafından üretilen metinlerdeki sayısal değerleri referans değerlerle kıyaslayan deterministik, tolerans tabanlı doğrulama katmanı."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zoo" }]
keywords = [
    "llm",
    "guardrail",
    "hallucination",
    "numeric-validation",
    "deterministic",
    "langchain",
    "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=15.0.0,<16",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.6.6,<2",
]
fastapi = [
    "fastapi>=0.142.2,<1",
    "httpx>=0.28.1,<1",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "coverage>=7.16.2,<8",
    "hypothesis>=6.168.3,<7",
    "httpx>=0.28.1,<1",
    "ruff>=0.16.9,<1",
    "mypy>=2.3.1,<3",
]

[project.urls]
Homepage = "https://github.com/koraysrn/agent-guard-eval"
Documentation = "https://github.com/koraysrn/agent-guard-eval#readme"
Issues = "https://github.com/koraysrn/agent-guard-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guard_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
source = ["agent_guard_eval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true
